<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Edit Product</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

<div class="container">

```
<div class="card">

    <h1>✏️ Edit Product</h1>

    <form action="/update/{{ product['id'] }}" method="POST">

        <!-- Product ID -->

        <label>Product ID</label>

        <input type="text"
               name="product_id"
               value="{{ product['product_id'] or '' }}"
               placeholder="Example: P001"
               required>


        <!-- Product Name -->

        <label>Product Name</label>

        <input type="text"
               name="name"
               value="{{ product['name'] or '' }}"
               placeholder="Product Name"
               required>


        <!-- Category -->

        <label>Category</label>

        <input type="text"
               name="category"
               value="{{ product['category'] or '' }}"
               placeholder="Category">


        <!-- Quantity -->

        <label>Quantity</label>

        <input type="number"
               name="quantity"
               value="{{ product['quantity'] or 0 }}"
               min="0"
               placeholder="Quantity"
               required>


        <!-- Price -->

        <label>Price</label>

        <input type="number"
               step="0.01"
               min="0"
               name="price"
               value="{{ product['price'] or 0 }}"
               placeholder="Price"
               required>


        <!-- Supplier -->

        <label>Supplier</label>

        <input type="text"
               name="supplier"
               value="{{ product['supplier'] or '' }}"
               placeholder="Supplier">


        <!-- Supplier Location -->

        <label>
            📍 Import / Supplier Location
        </label>

        <input type="text"
               name="supplier_location"
               value="{{ product['supplier_location'] or '' }}"
               placeholder="Example: Mumbai">


        <!-- Delivery Location -->

        <label>
            📍 Export / Delivery Location
        </label>

        <input type="text"
               name="delivery_location"
               value="{{ product['delivery_location'] or '' }}"
               placeholder="Example: Pune">


        <!-- Delivery Date -->

        <label>
            📅 Expected Delivery Date
        </label>

        <input type="date"
               name="delivery_date"
               value="{{ product['delivery_date'] or '' }}">


        <!-- Delivery Time -->

        <label>
            🕐 Expected Delivery Time
        </label>

        <input type="time"
               name="delivery_time"
               value="{{ product['delivery_time'] or '' }}">


        <br><br>

        <button type="submit">
            💾 Update Product
        </button>

    </form>


    <br>

    <a href="/">
        ⬅️ Back to Inventory
    </a>

</div>
```

</div>

</body>

</html>
