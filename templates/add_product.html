<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>➕ Add Product</h1>

    <form action="/add" method="POST">

        <label>Product ID:</label>
        <input type="text" name="product_id" required><br><br>

        <label>Product Name:</label>
        <input type="text" name="name" required><br><br>

        <label>Category:</label>
        <input type="text" name="category" required><br><br>

        <label>Quantity:</label>
        <input type="number" name="quantity" required><br><br>

        <label>Price:</label>
        <input type="number" name="price" required><br><br>

        <label>Supplier:</label>
        <input type="text" name="supplier" required><br><br>

        <label>Supplier Location:</label>
        <input type="text" name="supplier_location" placeholder="e.g. Mumbai" required><br><br>

        <label>Delivery Location:</label>
        <input type="text" name="delivery_location" placeholder="e.g. Thane" required><br><br>

        <button type="submit">Add Product</button>

    </form>

    <br>

    <a href="/">⬅ Back to Home</a>

</body>
</html>
