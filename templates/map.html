<!DOCTYPE html>
<html>
<head>

    <title>Product Route Map</title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        .location-box {
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 10px;
        }

        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <h1>🗺️ Supplier → Delivery Route</h1>

    <div class="location-box">

        <p>
            <strong>Product:</strong>
            {{ product['name'] }}
        </p>

        <p>
            <strong>Supplier:</strong>
            {{ product['supplier'] }}
        </p>

        <p>
            <strong>Supplier Location:</strong>
            {{ product['supplier_location'] }}
        </p>

        <p>
            <strong>Delivery Location:</strong>
            {{ product['delivery_location'] }}
        </p>

    </div>

    <div id="map"></div>

    <a href="/" class="back-button">
        ⬅️ Back to Inventory
    </a>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        // Supplier and delivery locations
        const supplierLocation =
            "{{ product['supplier_location'] }}";

        const deliveryLocation =
            "{{ product['delivery_location'] }}";


        // Create map
        const map = L.map('map').setView(
            [19.0760, 72.8777],
            10
        );


        // OpenStreetMap
        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);


        // Geocoding function
        async function getCoordinates(location) {

            const url =
                "https://nominatim.openstreetmap.org/search?format=json&q="
                + encodeURIComponent(location);

            const response = await fetch(url);

            const data = await response.json();

            if (data.length === 0) {
                throw new Error(
                    "Location not found: " + location
                );
            }

            return [
                parseFloat(data[0].lat),
                parseFloat(data[0].lon)
            ];
        }


        // Load map route
        async function loadRoute() {

            try {

                const supplier =
                    await getCoordinates(supplierLocation);

                const delivery =
                    await getCoordinates(deliveryLocation);


                // Supplier marker
                L.marker(supplier)
                    .addTo(map)
                    .bindPopup(
                        "📦 Supplier<br>" +
                        supplierLocation
                    )
                    .openPopup();


                // Delivery marker
                L.marker(delivery)
                    .addTo(map)
                    .bindPopup(
                        "🚚 Delivery<br>" +
                        deliveryLocation
                    );


                // Route using OSRM
                const routeURL =
                    "https://router.project-osrm.org/route/v1/driving/"
                    + supplier[1] + "," + supplier[0]
                    + ";"
                    + delivery[1] + "," + delivery[0]
                    + "?overview=full&geometries=geojson";


                const routeResponse =
                    await fetch(routeURL);

                const routeData =
                    await routeResponse.json();


                if (
                    routeData.routes &&
                    routeData.routes.length > 0
                ) {

                    const route =
                        routeData.routes[0];

                    L.geoJSON(route.geometry)
                        .addTo(map);

                    map.fitBounds(
                        L.geoJSON(route.geometry)
                            .getBounds()
                    );

                } else {

                    alert(
                        "Route could not be found."
                    );

                }

            } catch (error) {

                console.error(error);

                alert(
                    "Location or route could not be found."
                );

            }

        }


        loadRoute();

    </script>

</body>
</html>
